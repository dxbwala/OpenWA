# OpenWA — Production with TLS reverse proxy
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Public: https://wa.routedns.io  (TLS from ./certs)
# Local:  http://127.0.0.1:2785   (API direct, for admin/debug)

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    container_name: openwa-docker-proxy
    restart: unless-stopped
    networks:
      - internal-docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      VOLUMES: 1
      INFO: 1
      PING: 1
      POST: 1
      DELETE: 1
    labels:
      - 'com.openwa.service=docker-proxy'
      - 'com.openwa.core=true'

  openwa-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: openwa-openwa:latest
    container_name: openwa-api
    restart: unless-stopped
    stop_grace_period: 45s
    networks:
      - openwa-network
      - internal-docker
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: ${OPENWA_PIDS_LIMIT:-2048}
    mem_limit: ${OPENWA_MEM_LIMIT:-2g}
    # Localhost only — public traffic goes through openwa-proxy
    ports:
      - '127.0.0.1:${API_PORT:-2785}:2785'
    expose:
      - '2785'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp/.config
      - XDG_CACHE_HOME=/tmp/.cache
      - PORT=2785
      - DOCKER_HOST=tcp://docker-proxy:2375
    volumes:
      - ./data:/app/data
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    depends_on:
      docker-proxy:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:2785/api/health/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - 'com.openwa.service=api'
      - 'com.openwa.core=true'

  openwa-proxy:
    image: nginx:alpine
    container_name: openwa-proxy
    restart: unless-stopped
    depends_on:
      openwa-api:
        condition: service_healthy
    networks:
      - openwa-network
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/openwa.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    security_opt:
      - 'no-new-privileges:true'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - 'com.openwa.service=proxy'
      - 'com.openwa.core=true'

networks:
  openwa-network:
    name: openwa-network
  internal-docker:
    name: openwa-internal-docker
    internal: true
